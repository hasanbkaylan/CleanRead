<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CleanRead</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="appbar">
  <img src="logo.png" alt="CleanRead" class="appbar-logo" onerror="this.style.display='none'">
</div>

<main class="screen">
  <div class="hero">
    <h1>Hangi sınıftasın?</h1>
    <p>Sınıfını seç, ardından dersini bulup sayfa numarasına göre cevapları görüntüle.</p>
  </div>

  <div class="grade-grid" id="gradeGrid">
    <!-- JS ile dolduruluyor -->
  </div>

  <footer class="note">
    İçerik doğrudan kaynak siteden çekilir; CleanRead yalnızca sayfayı okunaklı şekilde düzenler.
  </footer>
</main>

<script src="app.js"></script>
<script>
  const GRADES = [9, 10, 11, 12];
  const grid = document.getElementById('gradeGrid');
  grid.innerHTML = GRADES.map(g => `
    <a class="grade-card" href="ders.html?sinif=${g}">
      <span class="msi">chevron_right</span>
      <span class="num">${g}</span>
      <span class="label">Sınıf</span>
    </a>
  `).join('');
</script>

</body>
</html>
