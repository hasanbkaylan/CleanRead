<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ders seç · CleanRead</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="appbar">
  <a class="appbar-icon-btn" href="index.html" aria-label="Geri">
    <span class="msi">arrow_back</span>
  </a>
  <div class="appbar-title">
    <span class="eyebrow">CleanRead</span>
    <span class="main" id="appbarTitle">Ders seç</span>
  </div>
</div>

<main class="screen">
  <div class="hero">
    <h1 id="heading">Dersini seç</h1>
    <p>Sayfa cevaplarını görüntülemek istediğin ders kitabını seç.</p>
  </div>

  <div class="subject-list" id="subjectList">
    <!-- JS ile dolduruluyor -->
  </div>
</main>

<script src="app.js"></script>
<script>
  const sinif = CR.qs('sinif');
  const heading = document.getElementById('heading');
  const appbarTitle = document.getElementById('appbarTitle');
  const list = document.getElementById('subjectList');

  if (!sinif) {
    location.replace('index.html');
  } else {
    heading.textContent = `${sinif}. sınıf dersleri`;
    appbarTitle.textContent = `${sinif}. Sınıf`;

    CR.loadKitaplar().then(data => {
      const dersler = data[sinif] || [];
      if (dersler.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <span class="msi">library_books</span>
            <strong>${sinif}. sınıf için henüz ders eklenmedi</strong>
            <span>Yakında burada görünecek.</span>
          </div>`;
        return;
      }
      list.innerHTML = dersler.map(d => `
        <a class="subject-card" href="oku.html?sinif=${encodeURIComponent(sinif)}&ders=${encodeURIComponent(d.id)}">
          <span class="subject-icon"><span class="msi">${d.ikon || CR.DEFAULT_ICON}</span></span>
          <span class="subject-text">
            <span class="name">${CR.escapeHtml(d.ad)}</span>
            <span class="pub">${CR.escapeHtml(d.yayin || '')}</span>
          </span>
          <span class="msi chevron">chevron_right</span>
        </a>
      `).join('');
    }).catch(() => {
      list.innerHTML = `
        <div class="empty-state">
          <span class="msi">error</span>
          <strong>Ders listesi yüklenemedi</strong>
          <span>Lütfen sayfayı yenileyip tekrar dene.</span>
        </div>`;
    });
  }
</script>

</body>
</html>
